[project]
name = "wiki-interest"
version = "1.0.0"
description = "Reproducible Wikipedia interest research for AI agents"
requires-python = ">=3.11"
dependencies = ["matplotlib==3.10.8", "reportlab==4.4.10"]

[dependency-groups]
dev = ["pytest==9.0.2", "pypdf==6.9.1", "ruff==0.15.7"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
